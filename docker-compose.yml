version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencodeapp
      POSTGRES_PASSWORD: opencodeapp_secret
      POSTGRES_DB: opencodeapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencodeapp -d opencodeapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
